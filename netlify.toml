[build]
  publish = "."
  functions = "netlify/functions"

# Route all /api/* requests to Netlify serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

# Route all other frontend navigation to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
